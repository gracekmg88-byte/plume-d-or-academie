    <script>
      // Redirection canonique des anciennes adresses vers www.kmgbibliotheque.com
      // (équivalent 301 côté client : remplace l'entrée d'historique + canonical <link>)
      (function () {
        try {
          var CANONICAL = "www.kmgbibliotheque.com";
          // plume-d-or-academie.lovable.app : domaine des QR codes des certificats délivrés avant la migration
          var LEGACY = ["www-kmgbibliotheque-com.lovable.app", "plume-d-or-academie.lovable.app", "kmgbibliotheque.com"];
          var h = window.location.hostname;
          // Ne jamais rediriger : dev local, previews Lovable, app native (Capacitor)
          if (
            h === CANONICAL ||
            h === "localhost" ||
            h === "127.0.0.1" ||
            h === "" ||
            window.location.protocol === "capacitor:" ||
            window.location.protocol === "file:" ||
            /(-)?preview--|\.lovableproject\.com$/.test(h)
          ) {
            return;
          }
          if (LEGACY.indexOf(h) !== -1) {
            // Garde-fou anti-boucle : si l'hébergeur renvoie www vers ce domaine
            // (domaine principal imposé côté Lovable), ne pas rediriger une 2e fois.
            var FLAG = "kmg-canonical-redirect-at";
            var last = 0;
            try { last = Number(sessionStorage.getItem(FLAG)) || 0; } catch (e) {}
            if (Date.now() - last < 30000) return;
            try { sessionStorage.setItem(FLAG, String(Date.now())); } catch (e) { return; }
            window.location.replace(
              "https://" + CANONICAL + window.location.pathname + window.location.search + window.location.hash
            );
          }
        } catch (e) {}
      })();
    </script>
